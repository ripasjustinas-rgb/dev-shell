# LaptopUI lock screen. Colors and background are prepared by laptopui-lock
# from the independently pinned SDDM wallpaper.
source = ~/.local/state/dev-shell/lock/colors.conf

general {
    hide_cursor = true
    immediate_render = true
}

animations {
    enabled = true
    bezier = laptopui, 0.22, 1, 0.36, 1
    animation = fadeIn, 1, 5, laptopui
    animation = fadeOut, 1, 4, laptopui
    animation = inputFieldDots, 1, 3, laptopui
}

background {
    monitor =
    path = ~/.local/state/dev-shell/lock/background.jpg
    color = $surface
    blur_passes = 0
}

# The same dark veil used by the SDDM theme.
shape {
    monitor =
    size = 100%, 100%
    color = $veil
    rounding = 0
    position = 0, 0
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor =
    text = $TIME
    color = $foreground
    font_size = 76
    font_family = JetBrainsMono Nerd Font
    position = 0, 420
    halign = center
    valign = center
    zindex = 3
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = $muted
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, 355
    halign = center
    valign = center
    zindex = 3
}

# Glass login card.
shape {
    monitor =
    size = 460, 350
    color = $card
    rounding = 26
    border_size = 1
    border_color = $outline
    shadow_passes = 3
    shadow_size = 14
    shadow_color = rgba(00000055)
    position = 0, 90
    halign = center
    valign = center
    zindex = 2
}

shape {
    monitor =
    size = 202, 2
    color = $primary
    rounding = 1
    position = 0, 263
    halign = center
    valign = center
    zindex = 3
}

label {
    monitor =
    text = 󰣇
    color = $primary
    font_size = 30
    font_family = JetBrainsMono Nerd Font
    position = 0, 185
    halign = center
    valign = center
    zindex = 3
}

label {
    monitor =
    text = Welcome back
    color = $foreground
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 125
    halign = center
    valign = center
    zindex = 3
}

label {
    monitor =
    text = justas
    color = $muted
    font_size = 10
    font_family = JetBrainsMono Nerd Font
    position = 0, 92
    halign = center
    valign = center
    zindex = 3
}

input-field {
    monitor =
    size = 406, 48
    outline_thickness = 1
    inner_color = $field
    outer_color = $outline
    check_color = $primary
    fail_color = $error
    font_color = $foreground
    font_family = JetBrainsMono Nerd Font
    placeholder_text = Password
    fail_text = That did not unlock it. Try again.
    rounding = 15
    dots_size = 0.18
    dots_spacing = 0.28
    fade_on_empty = false
    position = 0, 25
    halign = center
    valign = center
    zindex = 3
}

label {
    monitor =
    text = laptopui  •  secure session
    color = $mutedSoft
    font_size = 9
    font_family = JetBrainsMono Nerd Font
    position = 26, 24
    halign = left
    valign = bottom
    zindex = 3
}

label {
    monitor =
    text = 󰌾  type your password to unlock
    color = $muted
    font_size = 10
    font_family = JetBrainsMono Nerd Font
    position = 0, -60
    halign = center
    valign = center
    zindex = 3
}
