general {
    lock_cmd = pidof hyprlock || $HOME/.local/bin/laptopui-lock
    before_sleep_cmd = pidof hyprlock || ($HOME/.local/bin/laptopui-lock --immediate-render &)
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# Lock after five minutes of inactivity.
listener {
    timeout = 300
    on-timeout = $HOME/.local/bin/laptopui-lock
}

# Power down displays after ten minutes; any activity restores them.
listener {
    timeout = 600
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# Suspend after twenty minutes. before_sleep_cmd guarantees the lock first.
listener {
    timeout = 1200
    on-timeout = systemctl suspend
}
