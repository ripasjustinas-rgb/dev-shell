general {
    lock_cmd = pidof hyprlock || $HOME/.local/bin/laptopui-lock
    before_sleep_cmd = pidof hyprlock || ($HOME/.local/bin/laptopui-lock --immediate-render &)
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# On battery, lock after five minutes of inactivity.
listener {
    timeout = 300
    on-timeout = $HOME/.local/bin/laptopui-idle five-minute
}

# After ten minutes, lock on AC or power down displays on battery.
listener {
    timeout = 600
    on-timeout = $HOME/.local/bin/laptopui-idle ten-minute
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# Suspend after twenty minutes only on battery. Lid-close suspend is separate.
listener {
    timeout = 1200
    on-timeout = $HOME/.local/bin/laptopui-idle twenty-minute
}
