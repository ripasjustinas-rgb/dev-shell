# laptopui Kitty — translucent, compact and driven by the active wallpaper.

# Typography
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.5
modify_font      cell_height 110%

# Window surface
window_padding_width       14
placement_strategy         center
background_opacity         0.88
dynamic_background_opacity yes
background_blur            24
hide_window_decorations    yes
confirm_os_window_close    0
remember_window_size       yes
initial_window_width       108c
initial_window_height      30c

# Cursor and selection
cursor_shape          beam
cursor_blink_interval 0.6
cursor_stop_blinking_after 15
mouse_hide_wait       2.0
copy_on_select        clipboard
strip_trailing_spaces smart

# Tabs
tab_bar_edge            top
tab_bar_style           powerline
tab_powerline_style     slanted
tab_bar_align           left
tab_bar_margin_width    1.0
tab_bar_margin_height   6.0 0.0
tab_title_template      {fmt.fg._5c6370}{index}: {fmt.fg.default}{title}
active_tab_font_style   bold
inactive_tab_font_style normal

# Shell ergonomics
scrollback_lines          10000
wheel_scroll_multiplier   3.0
enable_audio_bell         no
visual_bell_duration      0.0
shell_integration         enabled
open_url_with             default
url_style                 curly
detect_urls               yes

# Static fallback palette. The generated wallpaper palette below overrides it.
foreground            #e8e0e8
background            #151218
selection_foreground  #3e2459
selection_background  #dabaf9
cursor                 #dabaf9
cursor_text_color      #3e2459
url_color              #d0c1da
active_border_color    #dabaf9
inactive_border_color  #4a454e
bell_border_color      #f3b7be
active_tab_foreground  #3e2459
active_tab_background  #dabaf9
inactive_tab_foreground #ccc4cf
inactive_tab_background #221e24
tab_bar_background     #151218

color0  #151218
color1  #ffb4ab
color2  #f3b7be
color3  #d0c1da
color4  #dabaf9
color5  #d0c1da
color6  #f3b7be
color7  #e8e0e8
color8  #4a454e
color9  #ffdad6
color10 #ffd9df
color11 #ecdcff
color12 #e9ddff
color13 #eadcf3
color14 #ffd9df
color15 #ffffff

# This file is generated atomically from the active wallpaper by matugen.
include ~/.local/state/laptopui/kitty-colors.conf
